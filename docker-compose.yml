# docker compose up --build
# Then open http://localhost:8000/docs. The importer loads the data once and stops.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fightlens
      POSTGRES_PASSWORD: fightlens
      POSTGRES_DB: fightlens
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fightlens"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://fightlens:fightlens@db:5432/fightlens
      REDIS_URL: redis://redis:6379/0
      IMPORT_TOKEN: ${IMPORT_TOKEN:-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5

  # Loads the data and stops. Run it again later with: docker compose run --rm importer
  importer:
    build: .
    command: ["python", "-m", "fightlens.importer"]
    environment:
      DATABASE_URL: postgresql://fightlens:fightlens@db:5432/fightlens
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
