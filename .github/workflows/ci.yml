name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fightlens
          POSTGRES_PASSWORD: fightlens
          POSTGRES_DB: fightlens_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fightlens" --health-interval 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start API, database and Redis
        run: docker compose up --build --detach --wait db redis api
      - name: Check that the API answers
        run: curl --fail localhost:8000/health
      - name: Show logs if something went wrong
        if: failure()
        run: docker compose logs
